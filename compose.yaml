services:
  web:
    build: .
    image: scanly-local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - scan-data:/app/data
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
  worker:
    image: scanly-local
    build: .
    command: ["npm", "run", "worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 110s
    volumes:
      - scan-data:/app/data
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 256
    shm_size: 256m
    tmpfs:
      - /tmp:size=256m,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
      - seccomp=./deploy/seccomp-profile.json
volumes:
  scan-data:
